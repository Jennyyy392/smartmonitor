# Конфигурация для запуска SmartMonitor в Docker
services:
  api:
    build:
      # Контекст сборки — корень проекта (на уровень выше каталога docker/)
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartmonitor_api
    ports:
      # Проброс порта: хост:контейнер
      - "8000:8000"
    env_file:
      # Переменные окружения из файла .env в корне проекта
      - ../.env
    volumes:
      # Монтируем каталог с данными, чтобы база сохранялась между перезапусками
      - ../data:/app/data
    healthcheck:
      # Проверка эндпоинта /api/v1/health средствами стандартной библиотеки Python
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3) as resp:
                  sys.exit(0 if resp.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped