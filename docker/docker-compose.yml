# Конфигурация для запуска SmartMonitor в Docker
services:
  api:
    build:
      # Контекст сборки — корень проекта (на уровень выше каталога docker/)
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartmonitor_api
    ports:
      # Проброс порта: хост:контейнер
      - "8000:8000"
    env_file:
      # Переменные окружения из файла .env в корне проекта
      - ../.env
    environment:
      # Планировщик запускается в отдельном сервисе worker
      ENABLE_SCHEDULER: "false"
    volumes:
      # Монтируем каталог с данными, чтобы база сохранялась между перезапусками
      - ../data:/app/data
    healthcheck:
      # Проверка эндпоинта /api/v1/health средствами стандартной библиотеки Python
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3) as resp:
                  sys.exit(0 if resp.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      # Тот же образ, что и у api
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smartmonitor_worker
    # Запускаем только планировщик, без HTTP-сервера
    command: ["python", "-m", "app.worker"]
    env_file:
      - ../.env
    environment:
      ENABLE_SCHEDULER: "true"
    volumes:
      # Общий каталог с базой данных
      - ../data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped